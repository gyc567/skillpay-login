<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>支付宝登录 · SkillPay</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
background:linear-gradient(160deg,#1677ff 0%,#0a54c4 100%);color:#fff;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;color:#222;border-radius:20px;padding:26px 22px;
box-shadow:0 16px 48px rgba(0,0,0,.25);text-align:center;max-width:360px;width:100%}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
.sub{font-size:13px;color:#888;margin:0 0 16px}
.qr{width:100%;max-width:272px;height:auto;image-rendering:pixelated;display:block;margin:0 auto;
border:1px solid #eee;border-radius:10px;background:#fff}
.btn{display:block;background:#1677ff;color:#fff;font-size:16px;font-weight:600;
padding:14px 20px;border-radius:12px;text-decoration:none;margin-top:16px}
.btn2{display:block;background:#f2f4f7;color:#555;font-size:14px;
padding:12px 20px;border-radius:12px;text-decoration:none;margin-top:10px}
.hint{font-size:12px;color:#999;margin-top:16px;line-height:1.75}
.hint b{color:#1677ff}
.reload{font-size:12px;color:#bbb;margin-top:14px;display:inline-block;text-decoration:none}
@media(prefers-color-scheme:dark){.card{background:#1c1c1e;color:#eee}.btn2{background:#2a2a2c;color:#bbb}}
</style>
</head>
<body>
<div class="card">
  <h1>支付宝扫码登录</h1>
  <p class="sub">SkillPay 创作者后台</p>
  <img class="qr" id="qr" src="qr.png" alt="支付宝登录二维码">
  <a class="btn" id="app" href="#">点此打开支付宝登录</a>
  <a class="btn2" id="web" href="#" target="_blank">用浏览器打开登录链接</a>
  <p class="hint"><b>长按二维码</b>识别，或直接点上面按钮唤起支付宝。<br>登录后请在手机上确认授权。</p>
  <a class="reload" href="?t=RELOAD">二维码已过期？点此刷新</a>
</div>
<script>
fetch('status.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d) return;
    var web = d.url || '';
    var app = d.app || ('alipays://platformapi/startapp?saId=10000007&clientVersion=3.7.0.0718&qrcode=' + encodeURIComponent(web));
    document.getElementById('app').href = app;
    document.getElementById('web').href = web;
    var img = document.getElementById('qr');
    img.src = 'qr.png?t=' + Date.now();
  })
  .catch(() => {});
</script>
</body>
</html>
